apiVersion: v1
kind: PersistentVolume
metadata:
  name: ping-pong-2-1-exercises-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  local:
    path: /tmp/kube-2-1-exercises
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-mycluster-agent-0