apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: todo-app:1.12
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-image-cache-pvc