apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-2-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output-2-1
  template:
    metadata:
      labels:
        app: log-output-2-1
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
      containers:
        - name: log-generator
          image: log-generator:2.1
          imagePullPolicy: Never
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
        - name: log-reader
          image: log-reader:2.1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files